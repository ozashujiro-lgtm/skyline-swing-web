<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Skyline Swing Web MVP</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed6ff;touch-action:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.6);z-index:10}
    #speed{position:absolute;right:18px;top:18px;font-weight:800;font-size:20px;text-align:right}
    #hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.25);padding:7px 10px;border-radius:12px;white-space:nowrap}
    #cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border:2px solid rgba(255,255,255,.9);border-radius:50%;box-sizing:border-box}
    #cross.lock{border-color:#ffe45c;box-shadow:0 0 10px #ffe45c}
    #joystick{position:fixed;left:18px;bottom:24px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);z-index:20;touch-action:none}
    #stick{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .btn{position:fixed;z-index:20;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(15,25,40,.55);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
    #swing{right:22px;bottom:30px;width:94px;height:94px;background:rgba(220,55,55,.72)}
    #jump{right:126px;bottom:34px;width:64px;height:64px}
    #dash{right:36px;bottom:137px;width:60px;height:60px}
    #dive{right:110px;bottom:119px;width:56px;height:56px}
    #restart{left:18px;top:16px;width:46px;height:46px;font-size:12px}
    #startOverlay{position:fixed;inset:0;background:linear-gradient(#79bcec,#d8efff);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
    #card{width:min(520px,92vw);background:rgba(10,20,35,.82);color:white;border-radius:24px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
    #card h1{margin:0 0 10px;font-size:28px}
    #card p{line-height:1.55;margin:8px 0}
    #play{margin-top:14px;width:100%;padding:15px;border:none;border-radius:16px;background:white;color:#111;font-size:18px;font-weight:800}
    #error{position:fixed;inset:0;background:#111;color:white;z-index:100;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;line-height:1.7}
  </style>
</head>
<body>
<div id="startOverlay">
  <div id="card">
    <h1>SKYLINE SWING</h1>
    <p>大都会をワイヤーで飛び回るスマホ向けブラウザ試作版です。</p>
    <p>左スティック：移動 / 右側ドラッグ：視点 / SWING長押し：ワイヤー / 離す：解除</p>
    <button id="play">プレイ開始</button>
  </div>
</div>
<div id="error">Three.js の読み込みに失敗しました。インターネット接続を確認して、ページを再読み込みしてください。</div>
<div id="hud">
  <div id="speed">0 km/h</div>
  <div id="hint">高いビルを狙って SWING 長押し</div>
  <div id="cross"></div>
</div>
<div id="joystick"><div id="stick"></div></div>
<div id="restart" class="btn">RESET</div>
<div id="swing" class="btn">SWING</div>
<div id="jump" class="btn">JUMP</div>
<div id="dash" class="btn">DASH</div>
<div id="dive" class="btn">DIVE</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) {
    document.getElementById('error').style.display='flex';
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd8ff);
  scene.fog = new THREE.Fog(0x9fd8ff, 180, 800);

  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 1400);
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = false;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x667788, 2.0);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(150,300,100);
  scene.add(sun);

  // ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200,1200),
    new THREE.MeshLambertMaterial({color:0x7f8c8d})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = 0;
  scene.add(ground);

  // roads grid
  const roadMat = new THREE.MeshLambertMaterial({color:0x2f3438});
  for (let x=-500;x<=500;x+=100){
    const r = new THREE.Mesh(new THREE.BoxGeometry(22,0.4,1100),roadMat);
    r.position.set(x,0.2,0); scene.add(r);
  }
  for (let z=-500;z<=500;z+=100){
    const r = new THREE.Mesh(new THREE.BoxGeometry(1100,0.4,22),roadMat);
    r.position.set(0,0.2,z); scene.add(r);
  }

  // city
  const buildings=[];
  const colors=[0x8aa0b2,0xa2abb5,0x778899,0x94a6b6,0xb0bac2];
  function addBuilding(x,z,w,d,h){
    const mat=new THREE.MeshLambertMaterial({color:colors[(Math.random()*colors.length)|0]});
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    b.position.set(x,h/2,z);
    b.userData.h=h;
    b.userData.half=new THREE.Vector3(w/2,h/2,d/2);
    scene.add(b); buildings.push(b);
  }
  for(let gx=-5; gx<=5; gx++){
    for(let gz=-5; gz<=5; gz++){
      if(Math.abs(gx)%1===0 && Math.abs(gz)%1===0){
        const cx=gx*100 + (Math.random()*18-9);
        const cz=gz*100 + (Math.random()*18-9);
        const count=1 + (Math.random()<0.35?1:0);
        for(let i=0;i<count;i++){
          const w=42+Math.random()*28, d=42+Math.random()*28;
          let h=45+Math.random()*130;
          if(Math.abs(gx)<=2 && Math.abs(gz)<=2) h+=60+Math.random()*100;
          addBuilding(cx+(i?28:-8),cz+(i?-22:6),w,d,h);
        }
      }
    }
  }

  // player
  const player = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.7,1.7,6,10),
    new THREE.MeshStandardMaterial({color:0x1b263b, roughness:.55})
  );
  body.rotation.z=Math.PI/2;
  player.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.58,14,14),new THREE.MeshStandardMaterial({color:0x31445c}));
  head.position.y=1.7; player.add(head);
  scene.add(player);

  const state={
    pos:new THREE.Vector3(0,40,120),
    vel:new THREE.Vector3(0,0,-2),
    yaw:Math.PI,
    pitch:-0.08,
    grounded:false,
    swing:false,
    anchor:new THREE.Vector3(),
    ropeLength:0,
    maxRope:145,
    lastTime:performance.now()/1000,
    joyX:0, joyY:0,
    dive:false
  };

  // rope line
  const ropeGeom=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const rope=new THREE.Line(ropeGeom,new THREE.LineBasicMaterial({color:0xf5f5f5}));
  rope.visible=false; scene.add(rope);

  function reset(){
    state.pos.set(0,48,120);
    state.vel.set(0,0,-2);
    state.yaw=Math.PI;
    state.pitch=-0.08;
    endSwing();
  }

  function capsuleGroundAndBuildings(nextPos){
    state.grounded=false;
    // ground
    if(nextPos.y < 1.35){
      nextPos.y=1.35;
      if(state.vel.y<0) state.vel.y=0;
      state.grounded=true;
    }
    // basic building collision: push outside AABB, allow standing on roof
    const r=0.7;
    for(const b of buildings){
      const hp=b.userData.half;
      const minX=b.position.x-hp.x-r, maxX=b.position.x+hp.x+r;
      const minZ=b.position.z-hp.z-r, maxZ=b.position.z+hp.z+r;
      const roof=b.position.y+hp.y;
      if(nextPos.x>minX && nextPos.x<maxX && nextPos.z>minZ && nextPos.z<maxZ){
        if(nextPos.y<=roof+1.5 && state.pos.y>=roof+0.4 && state.vel.y<=0){
          nextPos.y=roof+1.35; state.vel.y=0; state.grounded=true;
        } else if(nextPos.y<roof+1.0){
          const dx=Math.min(Math.abs(nextPos.x-minX),Math.abs(maxX-nextPos.x));
          const dz=Math.min(Math.abs(nextPos.z-minZ),Math.abs(maxZ-nextPos.z));
          if(dx<dz){
            nextPos.x = (nextPos.x < b.position.x) ? minX : maxX;
            state.vel.x*=0.55;
          } else {
            nextPos.z = (nextPos.z < b.position.z) ? minZ : maxZ;
            state.vel.z*=0.55;
          }
        }
      }
    }
  }

  function cameraForward(){
    return new THREE.Vector3(
      Math.sin(state.yaw)*Math.cos(state.pitch),
      Math.sin(state.pitch),
      Math.cos(state.yaw)*Math.cos(state.pitch)
    ).normalize();
  }
  function flatForward(){
    return new THREE.Vector3(Math.sin(state.yaw),0,Math.cos(state.yaw)).normalize();
  }
  function rightVec(){
    const f=flatForward();
    return new THREE.Vector3(f.z,0,-f.x);
  }

  function rayAABB(origin,dir,b,maxDist){
    const hp=b.userData.half, min=b.position.clone().sub(hp), max=b.position.clone().add(hp);
    let tmin=0, tmax=maxDist;
    for(const axis of ['x','y','z']){
      const o=origin[axis], d=dir[axis];
      if(Math.abs(d)<1e-6){ if(o<min[axis]||o>max[axis]) return null; }
      else{
        let t1=(min[axis]-o)/d, t2=(max[axis]-o)/d;
        if(t1>t2){const q=t1;t1=t2;t2=q;}
        tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2);
        if(tmax<tmin) return null;
      }
    }
    if(tmin<0||tmin>maxDist) return null;
    return tmin;
  }

  function findAnchor(preview=false){
    const origin=state.pos.clone().add(new THREE.Vector3(0,1.2,0));
    const dir=cameraForward();
    let best=null, bestScore=1e9;
    // strong preference for camera ray hits, then nearby upper facade points
    for(const b of buildings){
      const t=rayAABB(origin,dir,b,state.maxRope);
      if(t!=null && t<bestScore){
        bestScore=t;
        best=origin.clone().addScaledVector(dir,t);
      }
    }
    if(best) return best;

    // aim assist cone
    let bestDot=0.86;
    for(const b of buildings){
      const top=b.position.clone().add(new THREE.Vector3(0,b.userData.half.y*0.72,0));
      const to=top.clone().sub(origin);
      const dist=to.length();
      if(dist>state.maxRope||dist<8) continue;
      const dot=dir.dot(to.normalize());
      if(dot>bestDot && top.y>state.pos.y-8){
        bestDot=dot; best=top;
      }
    }
    return best;
  }

  function beginSwing(){
    const a=findAnchor();
    if(!a) return;
    state.swing=true;
    state.anchor.copy(a);
    state.ropeLength=Math.max(10,Math.min(state.maxRope,state.pos.distanceTo(a)));
    rope.visible=true;
  }
  function endSwing(){
    state.swing=false;
    rope.visible=false;
  }

  function physics(dt){
    dt=Math.min(dt,0.025);
    const move=new THREE.Vector3();
    move.addScaledVector(flatForward(), -state.joyY);
    move.addScaledVector(rightVec(), state.joyX);
    if(move.lengthSq()>1) move.normalize();

    const accel=state.grounded?34:10;
    state.vel.addScaledVector(move, accel*dt);

    // speed damping
    const horiz=new THREE.Vector3(state.vel.x,0,state.vel.z);
    const hspeed=horiz.length();
    const targetMax=state.swing?58:20;
    if(hspeed>targetMax){
      horiz.multiplyScalar(targetMax/hspeed);
      state.vel.x=horiz.x; state.vel.z=horiz.z;
    }

    // gravity / dive
    state.vel.y += (state.dive ? -31 : -20) * dt;

    if(state.swing){
      // small pump in facing/input direction
      const pump=move.lengthSq()>.02 ? move : flatForward();
      state.vel.addScaledVector(pump, 8.0*dt);

      // rope constraint + centripetal correction
      const toP=state.pos.clone().sub(state.anchor);
      const dist=toP.length();
      if(dist>0.001){
        const radial=toP.multiplyScalar(1/dist);
        const radialSpeed=state.vel.dot(radial);
        // remove outward radial velocity when taut
        if(dist>=state.ropeLength*0.985 && radialSpeed>0){
          state.vel.addScaledVector(radial,-radialSpeed);
        }
        // soft pull toward anchor
        const stretch=Math.max(0,dist-state.ropeLength);
        state.vel.addScaledVector(radial,-stretch*28*dt);
      }
    }

    const next=state.pos.clone().addScaledVector(state.vel,dt);

    if(state.swing){
      const delta=next.clone().sub(state.anchor);
      const dist=delta.length();
      if(dist>state.ropeLength){
        delta.multiplyScalar(state.ropeLength/dist);
        next.copy(state.anchor).add(delta);
        const radial=delta.clone().normalize();
        const rs=state.vel.dot(radial);
        if(rs>0) state.vel.addScaledVector(radial,-rs);
      }
    }

    capsuleGroundAndBuildings(next);
    state.pos.copy(next);

    if(state.grounded){
      const groundH=new THREE.Vector3(state.vel.x,0,state.vel.z);
      groundH.multiplyScalar(Math.pow(0.15,dt));
      state.vel.x=groundH.x; state.vel.z=groundH.z;
    }

    player.position.copy(state.pos);
    if(state.vel.lengthSq()>.5){
      const targetYaw=Math.atan2(state.vel.x,state.vel.z);
      body.rotation.y = -targetYaw;
      head.rotation.y = -targetYaw;
    }
  }

  function updateCamera(dt){
    const f=cameraForward();
    const flat=flatForward();
    const speed=state.vel.length();
    camera.fov = THREE.MathUtils.lerp(camera.fov, THREE.MathUtils.clamp(68+speed*0.28,68,91), 1-Math.pow(.001,dt));
    camera.updateProjectionMatrix();

    const target=state.pos.clone().add(new THREE.Vector3(0,1.2,0));
    const desired=target.clone()
      .addScaledVector(flat,-8.5-speed*0.035)
      .add(new THREE.Vector3(0,3.8,0));
    camera.position.lerp(desired,1-Math.pow(.00008,dt));
    camera.lookAt(target.clone().addScaledVector(f,12));
  }

  function updateRope(){
    if(!state.swing) return;
    const arr=rope.geometry.attributes.position.array;
    arr[0]=state.pos.x; arr[1]=state.pos.y+1.2; arr[2]=state.pos.z;
    arr[3]=state.anchor.x; arr[4]=state.anchor.y; arr[5]=state.anchor.z;
    rope.geometry.attributes.position.needsUpdate=true;
  }

  // inputs
  const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
  let joyId=null;
  function setJoy(x,y){
    const r=47, len=Math.hypot(x,y)||1, s=Math.min(1,r/len);
    const dx=x*s, dy=y*s;
    stick.style.transform=`translate(${dx}px,${dy}px)`;
    state.joyX=dx/r; state.joyY=dy/r;
  }
  joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);const r=joy.getBoundingClientRect();setJoy(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));});
  joy.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;const r=joy.getBoundingClientRect();setJoy(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));});
  function clearJoy(e){if(joyId!==null&&(e.pointerId===joyId||e.type==='pointercancel')){joyId=null;stick.style.transform='translate(0,0)';state.joyX=state.joyY=0;}}
  joy.addEventListener('pointerup',clearJoy); joy.addEventListener('pointercancel',clearJoy);

  // camera swipe on screen except controls
  let camId=null, lastX=0,lastY=0;
  renderer.domElement.addEventListener('pointerdown',e=>{camId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
  renderer.domElement.addEventListener('pointermove',e=>{
    if(e.pointerId!==camId)return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    state.yaw -= dx*0.006;
    state.pitch = THREE.MathUtils.clamp(state.pitch-dy*0.0045,-0.72,0.6);
  });
  renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===camId)camId=null;});
  renderer.domElement.addEventListener('pointercancel',()=>camId=null);

  const swingBtn=document.getElementById('swing');
  swingBtn.addEventListener('pointerdown',e=>{e.preventDefault();beginSwing();});
  swingBtn.addEventListener('pointerup',e=>{e.preventDefault();endSwing();});
  swingBtn.addEventListener('pointercancel',endSwing);
  document.getElementById('jump').addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(state.grounded){state.vel.y=12;state.grounded=false;}
    else if(state.swing){
      const f=flatForward(); state.vel.addScaledVector(f,8); state.vel.y+=5;
    }
  });
  document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();state.vel.addScaledVector(cameraForward(),15);});
  const diveBtn=document.getElementById('dive');
  diveBtn.addEventListener('pointerdown',e=>{e.preventDefault();state.dive=true;});
  diveBtn.addEventListener('pointerup',e=>{e.preventDefault();state.dive=false;});
  diveBtn.addEventListener('pointercancel',()=>state.dive=false);
  document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();reset();});

  // keyboard fallback
  const keys={};
  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&state.grounded){state.vel.y=12;state.grounded=false;}if(e.code==='KeyR')reset();if(e.code==='KeyE')beginSwing();});
  addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyE')endSwing();});

  document.getElementById('play').onclick=()=>{
    document.getElementById('startOverlay').style.display='none';
  };

  function loop(){
    requestAnimationFrame(loop);
    const now=performance.now()/1000, dt=Math.min(.033,now-state.lastTime); state.lastTime=now;

    // keyboard movement
    if(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD){
      state.joyY=(keys.KeyW?-1:0)+(keys.KeyS?1:0);
      state.joyX=(keys.KeyD?1:0)+(keys.KeyA?-1:0);
    }

    physics(dt);
    updateCamera(dt);
    updateRope();

    const anchor=findAnchor(true);
    document.getElementById('cross').classList.toggle('lock',!!anchor);
    document.getElementById('speed').textContent=Math.round(state.vel.length()*3.6)+' km/h';

    if(state.pos.y<-80 || Math.abs(state.pos.x)>900 || Math.abs(state.pos.z)>900) reset();
    renderer.render(scene,camera);
  }
  reset(); loop();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
